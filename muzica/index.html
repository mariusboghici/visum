<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>În curând | Marius Boghici</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f1012;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .coming-soon-container {
            max-width: 500px;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }
        p {
            color: #9ca3af;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn-back {
            display: inline-block;
            padding: 12px 24px;
            background-color: #2a2d34;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            border: 1px solid #3f444e;
            transition: all 0.2s ease;
        }
        .btn-back:hover {
            background-color: #3b3e47;
            border-color: #525866;
        }
    </style>
</head>
<body>

    <div class="coming-soon-container">
        <h1>În curând...</h1>
        <p>Această secțiune este în lucru și va fi disponibilă în curând.</p>
        <a href="/" class="btn-back">&larr; Înapoi la pagina principală</a>
    </div>

</body>
</html>
