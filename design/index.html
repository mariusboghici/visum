<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Design | Marius Răzvan Boghici</title>
    <meta name="description" content="Portofoliu de design: identitate vizuală, concepte grafice și proiecte digitale realizate de Marius Răzvan Boghici.">
    <meta name="author" content="Marius Răzvan Boghici">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.mariusboghici.com/design/">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Marius Boghici">
    <meta property="og:title" content="Design & Concepte Grafice | Marius Boghici">
    <meta property="og:description" content="Identitate vizuală, concepte și proiecte grafice.">
    <meta property="og:image" content="../03.jpg">
    <meta property="og:url" content="https://www.mariusboghici.com/design/">

    <!-- Legătură către style.css din același folder -->
    <link rel="stylesheet" href="style.css?v=1">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="site-header">
        <h1 class="logo">Marius Răzvan BOGHICI</h1>
        <p class="tagline">Expresie Creativă</p>
    </header>

    <main class="container" id="main-content">
        
        <div class="page-header">
            <div>
                <h2 style="color: #fff; font-size: 1.8rem;">Design &amp; Vectori</h2>
                <p style="color: #888899; font-size: 0.95rem;">Identitate vizuală, simbolică și elemente grafice.</p>
            </div>
            <a href="../" class="back-link">&larr; Înapoi la Hub</a>
        </div>

        <hr class="divider" style="margin: 20px 0 30px;">

        <!-- Banner Panoramic (one3.png) -->
        <div class="featured-banner" onclick="openLightbox('one3.png')">
            <img src="one3.png" alt="Onești Vector Skyline Panoramic" loading="eager">
        </div>

        <!-- Galerie Simboluri (Toate PNG) -->
        <section class="gallery-grid" aria-label="Galerie simboluri vectoriale">
            
            <button class="gallery-item" onclick="openLightbox('one2.png')">
                <img src="one2.png" alt="Poster Grafic Onești" loading="lazy">
            </button>

            <button class="gallery-item" onclick="openLightbox('hotel.png')">
                <img src="hotel.png" alt="Hotel Trotuș" loading="lazy">
            </button>

            <button class="gallery-item" onclick="openLightbox('catedrala.png')">
                <img src="catedrala.png" alt="Catedrala" loading="lazy">
            </button>

            <button class="gallery-item" onclick="openLightbox('borzesti.png')">
                <img src="borzesti.png" alt="Biserica Borzești" loading="lazy">
            </button>

            <button class="gallery-item" onclick="openLightbox('casa-de-cultura.png')">
                <img src="casa-de-cultura.png" alt="Casa de Cultură" loading="lazy">
            </button>

            <button class="gallery-item" onclick="openLightbox('stefan.png')">
                <img src="stefan.png" alt="Monument Ștefan cel Mare" loading="lazy">
            </button>

            <button class="gallery-item" onclick="openLightbox('eminescu.png')">
                <img src="eminescu.png" alt="Bustul Mihai Eminescu" loading="lazy">
            </button>

            <button class="gallery-item" onclick="openLightbox('nadia.png')">
                <img src="nadia.png" alt="Monumentul Nadia Comăneci" loading="lazy">
            </button>

            <button class="gallery-item" onclick="openLightbox('sala-de-sport.png')">
                <img src="sala-de-sport.png" alt="Sala de Sport" loading="lazy">
            </button>

            <button class="gallery-item" onclick="openLightbox('biblioteca.png')">
                <img src="biblioteca.png" alt="Biblioteca Municipală" loading="lazy">
            </button>

            <button class="gallery-item" onclick="openLightbox('primaria.png')">
                <img src="primaria.png" alt="Primăria" loading="lazy">
            </button>

        </section>

    </main>

    <dialog id="lightbox" onclick="closeLightbox(event)">
        <button class="close-btn" aria-label="Închide imaginea">&times;</button>
        <img id="lightbox-img" src="" alt="Imagine mărită">
    </dialog>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.showModal();
        }

        function closeLightbox(event) {
            if (event.target === lightbox || event.target.classList.contains('close-btn')) {
                lightbox.close();
            }
        }
    </script>

    <footer class="site-footer">
        <p>&copy; <a href="tel:+40774022381" class="footer-phone-link" aria-label="Sună la Marius Răzvan Boghici">Marius Răzvan Boghici</a>. Toate drepturile rezervate.</p>
    </footer>

</body>
</html>
