<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design | Marius Răzvan Boghici</title>

    <!-- Forțăm reîncărcarea stilului -->
    <link rel="stylesheet" href="style.css?v=99">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="site-header">
        <h1 class="logo">Marius Răzvan BOGHICI</h1>
        <p class="tagline">Expresie Creativă</p>
    </header>

    <main class="container">
        
        <div class="page-header">
            <div>
                <h2 style="color: #fff; font-size: 1.8rem;">Design &amp; Vectori</h2>
                <p style="color: #888899; font-size: 0.95rem;">Identitate vizuală, simbolică și elemente grafice.</p>
            </div>
            <a href="../" class="back-link">&larr; Înapoi la Hub</a>
        </div>

        <hr class="divider" style="margin: 20px 0 30px;">

        <!-- Panorama Sus -->
        <div class="featured-banner" onclick="openLightbox('one3.png')">
            <img src="one3.png" alt="Onești Vector Skyline Panoramic" loading="eager">
        </div>

        <!-- Galerie -->
        <section class="gallery-grid">
            <button class="gallery-item" onclick="openLightbox('one2.png')">
                <img src="one2.png" alt="Poster Grafic Onești">
            </button>

            <button class="gallery-item" onclick="openLightbox('hotel.png')">
                <img src="hotel.png" alt="Hotel Trotuș">
            </button>

            <button class="gallery-item" onclick="openLightbox('catedrala.png')">
                <img src="catedrala.png" alt="Catedrala">
            </button>

            <button class="gallery-item" onclick="openLightbox('borzesti.png')">
                <img src="borzesti.png" alt="Biserica Borzești">
            </button>

            <button class="gallery-item" onclick="openLightbox('casa-de-cultura.png')">
                <img src="casa-de-cultura.png" alt="Casa de Cultură">
            </button>

            <button class="gallery-item" onclick="openLightbox('stefan.png')">
                <img src="stefan.png" alt="Monument Ștefan cel Mare">
            </button>

            <button class="gallery-item" onclick="openLightbox('eminescu.png')">
                <img src="eminescu.png" alt="Bustul Mihai Eminescu">
            </button>

            <button class="gallery-item" onclick="openLightbox('nadia.png')">
                <img src="nadia.png" alt="Monumentul Nadia Comăneci">
            </button>

            <button class="gallery-item" onclick="openLightbox('sala-de-sport.png')">
                <img src="sala-de-sport.png" alt="Sala de Sport">
            </button>

            <button class="gallery-item" onclick="openLightbox('biblioteca.png')">
                <img src="biblioteca.png" alt="Biblioteca Municipală">
            </button>

            <button class="gallery-item" onclick="openLightbox('primaria.png')">
                <img src="primaria.png" alt="Primăria">
            </button>
        </section>

    </main>

    <dialog id="lightbox" onclick="closeLightbox(event)">
        <button class="close-btn">&times;</button>
        <img id="lightbox-img" src="" alt="Imagine mărită">
    </dialog>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.showModal();
        }

        function closeLightbox(event) {
            if (event.target === lightbox || event.target.classList.contains('close-btn')) {
                lightbox.close();
            }
        }
    </script>

    <footer class="site-footer">
        <p>&copy; <a href="tel:+40774022381" class="footer-phone-link">Marius Răzvan Boghici</a>. Toate drepturile rezervate.</p>
    </footer>

</body>
</html>
