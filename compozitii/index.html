<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO de bază -->
    <title>Compoziții | Marius Răzvan Boghici</title>
    <meta name="description" content="Galerie de manipulări foto, aranjamente și compoziții digitale create de Marius Răzvan Boghici.">
    <meta name="author" content="Marius Răzvan Boghici">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.mariusboghici.com/compozitii/">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Marius Boghici">
    <meta property="og:title" content="Compoziții Vizuale | Marius Boghici">
    <meta property="og:description" content="Manipulări foto și creații digitale.">
    <meta property="og:image" content="../02.jpg">
    <meta property="og:url" content="https://www.mariusboghici.com/compozitii/">

    <!-- Stiluri existente + font -->
    <link rel="stylesheet" href="../style.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        /* Adaptare layout pentru Galerie */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .back-link {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #2563eb;
            text-decoration: underline;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            background-color: #18181c;
            border: 1px solid #2a2a32;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
            opacity: 0.75;
            padding: 0;
            outline: none;
        }

        .gallery-item:hover {
            opacity: 1;
            transform: translateY(-4px);
            border-color: #3b82f6;
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        /* Modal Lightbox Nativ */
        dialog#lightbox {
            padding: 0;
            background: transparent;
            border: none;
            max-width: 90vw;
            max-height: 90vh;
            margin: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
            border-radius: 8px;
            overflow: hidden;
        }

        dialog#lightbox::backdrop {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
        }

        dialog#lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            display: block;
            object-fit: contain;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .close-btn:hover {
            background: #3b82f6;
        }
    </style>
</head>
<body>

    <!-- Header / Branding -->
    <header class="site-header">
        <h1 class="logo">Marius Răzvan BOGHICI</h1>
        <p class="tagline">Expresie Creativă</p>
    </header>

    <main class="container" id="main-content">
        
        <!-- Antet Pagină Compoziții -->
        <div class="page-header">
            <div>
                <h2 style="color: #fff; font-size: 1.8rem;">Compoziții</h2>
                <p style="color: #888899; font-size: 0.95rem;">Manipulări foto și aranjamente digitale.</p>
            </div>
            <a href="../" class="back-link">&larr; Înapoi la Hub</a>
        </div>

        <hr class="divider" style="margin: 20px 0 30px;">

        <!-- Galerie 8 Imagini -->
        <section class="gallery-grid" aria-label="Galerie de compoziții">
            
            <!-- Imaginea 1 -->
            <button class="gallery-item" onclick="openLightbox('img1.jpg')">
                <img src="img1.jpg" alt="Compoziție digitală 1" loading="lazy">
            </button>

            <!-- Imaginea 2 -->
            <button class="gallery-item" onclick="openLightbox('img2.jpg')">
                <img src="img2.jpg" alt="Compoziție digitală 2" loading="lazy">
            </button>

            <!-- Imaginea 3 -->
            <button class="gallery-item" onclick="openLightbox('img3.jpg')">
                <img src="img3.jpg" alt="Compoziție digitală 3" loading="lazy">
            </button>

            <!-- Imaginea 4 -->
            <button class="gallery-item" onclick="openLightbox('img4.jpg')">
                <img src="img4.jpg" alt="Compoziție digitală 4" loading="lazy">
            </button>

            <!-- Imaginea 5 -->
            <button class="gallery-item" onclick="openLightbox('img5.jpg')">
                <img src="img5.jpg" alt="Compoziție digitală 5" loading="lazy">
            </button>

            <!-- Imaginea 6 -->
            <button class="gallery-item" onclick="openLightbox('img6.jpg')">
                <img src="img6.jpg" alt="Compoziție digitală 6" loading="lazy">
            </button>

            <!-- Imaginea 7 -->
            <button class="gallery-item" onclick="openLightbox('img7.jpg')">
                <img src="img7.jpg" alt="Compoziție digitală 7" loading="lazy">
            </button>

            <!-- Imaginea 8 -->
            <button class="gallery-item" onclick="openLightbox('img8.jpg')">
                <img src="img8.jpg" alt="Compoziție digitală 8" loading="lazy">
            </button>

        </section>

    </main>

    <!-- Modal Lightbox (Nativ HTML5) -->
    <dialog id="lightbox" onclick="closeLightbox(event)">
        <button class="close-btn" aria-label="Închide imaginea">&times;</button>
        <img id="lightbox-img" src="" alt="Imagine mărită">
    </dialog>

    <!-- Script simplu de 5 rânduri pentru deschidere/închidere imagine -->
    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.showModal();
        }

        function closeLightbox(event) {
            // Închide modalul la click pe fundal sau pe butonul X
            if (event.target === lightbox || event.target.classList.contains('close-btn')) {
                lightbox.close();
            }
        }
    </script>

    <!-- Footer -->
      <footer class="site-footer">
        <p>&copy; <a href="tel:+40774022381" class="footer-phone-link">Marius Răzvan Boghici</a>. Toate drepturile rezervate.</p>
    </footer>

</body>
</html>
